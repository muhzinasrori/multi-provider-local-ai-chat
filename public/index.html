<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Chat</title>
  <link rel="stylesheet" href="/vendor/highlightjs/styles/github-dark.min.css" id="hljs-theme" />
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/vendor/katex/katex.min.css" />
</head>
<body>
  <!-- Sidebar -->
  <aside id="sidebar" class="sidebar">
    <div class="sidebar-head">
      <button id="new-chat-btn" class="btn-new-chat" title="Chat baru">
        <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <span>New Chat</span>
      </button>
      <button id="close-sidebar-btn" class="icon-btn" title="Tutup sidebar">
        <svg viewBox="0 0 24 24" width="18" height="18"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M15 6l-6 6 6 6"/></svg>
      </button>
    </div>
    <nav id="chat-list" class="chat-list" aria-label="Riwayat chat"></nav>
    <div class="sidebar-foot">
      <button id="theme-toggle" class="icon-btn wide" title="Ganti tema terang/gelap">
        <span id="theme-icon">🌙</span> <span id="theme-label">Mode Gelap</span>
      </button>
    </div>
  </aside>

  <!-- Overlay untuk membuka sidebar di mobile -->
  <div id="sidebar-overlay" class="sidebar-overlay"></div>

  <!-- Area utama -->
  <main class="main">
    <header class="topbar">
      <button id="open-sidebar-btn" class="icon-btn" title="Buka sidebar">
        <svg viewBox="0 0 24 24" width="20" height="20"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <select id="model-select" class="model-select" title="Pilih model AI"></select>
      <span id="no-key-banner" class="banner hidden">
        Belum ada API Key aktif — isi <code>.env</code> atau set <code>MOCK_API=true</code>.
      </span>
    </header>

    <section id="messages" class="messages" aria-live="polite">
      <div id="welcome" class="welcome">
        <h1>Pesan ke <span id="welcome-model">AI</span></h1>
        <div class="suggestions">
          <button class="suggestion" data-prompt="Jelaskan arsitektur Node.js + Express + SQLite dalam poin-poin.">💡 Jelaskan arsitektur MERN-like ini</button>
          <button class="suggestion" data-prompt="Buatkan fungsi JavaScript untuk debounce, beserta contoh pemakaian dan blok kode.">⌨️ Buatkan fungsi debounce + kode</button>
          <button class="suggestion" data-prompt="Bandingkan model glm-4.7-flash dan gemini-2.5-flash dalam bentuk tabel.">📊 Bandingkan dua model flash</button>
          <button class="suggestion" data-prompt="Tulis tabel markdown berisi 3 resep masakan sederhana beserta bahannya.">🍳 Resep sederhana (tabel)</button>
        </div>
      </div>
    </section>

    <!-- Composer -->
    <section id="composer-zone" class="composer-zone">
      <div id="attachments-preview" class="attachments-preview hidden"></div>
      <form id="composer" class="composer">
        <button type="button" id="attach-btn" class="icon-btn" title="Unggah gambar / dokumen">
          <svg viewBox="0 0 24 24" width="20" height="20"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M21.4 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.2-9.19a4 4 0 015.65 5.66L9.4 17.37a2 2 0 01-2.83-2.83l8.49-8.48"/></svg>
        </button>
        <input type="file" id="file-input" multiple hidden
               accept=".jpg,.jpeg,.png,.webp,.gif,.txt,.pdf,.json,.js,.py,.csv,.md" />
        <textarea id="input" rows="1" placeholder="Kirim pesan… (tempel gambar dengan Ctrl+V, atau seret file ke sini)"></textarea>
        <button type="submit" id="send-btn" class="send-btn" title="Kirim" disabled>
          <svg viewBox="0 0 24 24" width="20" height="20"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M12 19V5M5 12l7-7 7 7"/></svg>
        </button>
      </form>
      <p class="hint">AI dapat keliru. Periksa kembali informasi penting. Lampiran: JPG/PNG/WEBP · TXT/PDF/JSON/JS/PY/CSV/MD</p>
    </section>
  </main>

  <div id="toast" class="toast hidden"></div>

  <script src="/vendor/markdown-it/markdown-it.min.js"></script>
  <script src="/vendor/highlightjs/highlight.min.js"></script>
  <script src="/vendor/katex/katex.min.js"></script>
  <script src="/vendor/katex/contrib/auto-render.min.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
